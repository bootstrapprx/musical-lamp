api_version: musical-lamp/v1
kind: ProductBlueprint
metadata:
  id: accounting
  name: Accounting
  revision: 1
framework:
  app: frappe
apps:
  - app: erpnext
sites:
  - name: accounting.example.invalid
    host_name: https://accounting.example.invalid
runtime:
  image:
    policy: build
    repository: registry.example.invalid/kodoo/accounting
  database:
    engine: mariadb
    image: mariadb@sha256:REPLACE_WITH_VERIFIED_DIGEST
  cache:
    engine: redis
    image: redis@sha256:REPLACE_WITH_VERIFIED_DIGEST
network:
  edge_subnet: 172.30.2.0/28
  edge_ip_range: 172.30.2.8/29
  cloudflared_ip: 172.30.2.2
secrets:
  - ref: db_password
  - ref: tunnel_token
deployment:
  require_approval: true
  backup_before_migrate: true
